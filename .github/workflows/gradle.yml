name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Force Gradle 9.1+
        run: sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.1.0-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - run: chmod +x gradlew

      - run: ./gradlew clean jar --no-daemon --stacktrace

      - name: Get version
        id: version
        run: |
          VERSION=$(grep "^version" build.gradle | sed "s/.*['\"]\\(.*\\)['\"].*/\\1/")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Find JAR
        id: jar
        run: |
          JAR=$(ls build/libs/*.jar | head -n 1)
          echo "jar=$JAR" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            适配 Minecraft **26.3**

            **依赖**
            - 需要 PacketEvents ≥ 2.14.0
          files: ${{ steps.jar.outputs.jar }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
