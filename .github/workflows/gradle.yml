name: Build and Release

on:
  push:
    tags:
      - 'v*'          # 推送 v1.5.0、v1.5.1 这种标签时自动发布
  workflow_dispatch:  # 也可以手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要写权限来创建 Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Find the built JAR
        id: jar
        run: |
          JAR_FILE=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          echo "jar=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Found JAR: $JAR_FILE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PaperAccurateBlockPlacement ${{ github.ref_name }}
          body: |
            ## PaperAccurateBlockPlacement ${{ github.ref_name }}
            
            - 适配 Minecraft **26.3**
            - 支持 Litematica Easy Place + Tweakeroo Accurate/Flexible Block Placement
            - 需要依赖 [PacketEvents](https://modrinth.com/plugin/packetevents) ≥ 2.14.0
            
            ### 安装方法
            1. 下载本 Release 的 JAR
            2. 放入服务器 `plugins` 文件夹
            3. 确保已安装对应版本的 PacketEvents
            4. 重启服务器即可
          files: ${{ steps.jar.outputs.jar }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
