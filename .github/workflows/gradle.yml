name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Force Gradle 9.1+ (Java 25 support)
        run: |
          # 强制升级到支持 Java 25 的 Gradle
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.1.0-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          echo "当前 gradle-wrapper.properties 内容："
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Find the built JAR
        id: jar
        run: |
          echo "=== build/libs 内容 ==="
          ls -la build/libs/ || true
          JAR_FILE=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" ! -name "*-plain.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "没有找到 JAR 文件！"
            exit 1
          fi
          echo "jar=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "找到 JAR: $JAR_FILE"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PaperAccurateBlockPlacement ${{ github.ref_name }}
          body: |
            ## PaperAccurateBlockPlacement ${{ github.ref_name }}
            
            - 适配 Minecraft **26.3**
            - 支持 Litematica Easy Place + Tweakeroo Accurate/Flexible Block Placement
            - 需要依赖 [PacketEvents](https://modrinth.com/plugin/packetevents) ≥ 2.14.0
            
            ### 安装方法
            1. 下载本 Release 的 JAR
            2. 放入服务器 `plugins` 文件夹
            3. 确保已安装对应版本的 PacketEvents
            4. 重启服务器即可
          files: ${{ steps.jar.outputs.jar }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
